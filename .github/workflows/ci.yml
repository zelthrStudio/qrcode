name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - name: Set node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: pnpm

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      - name: Lint
        run: nr lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - name: Set node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: pnpm

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      - name: Typecheck
        run: nr typecheck

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [18.x]
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      - name: Build
        run: nr build

      - name: Test
        run: nr test

  publish:
    name: Publish to npm (OIDC trusted publishing)
    # Publish ONLY on version tags (v*). Never on branch pushes or PRs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - name: Set node
        uses: actions/setup-node@v3
        with:
          node-version: 24.x
          cache: pnpm

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; Node 24 ships
      # an npm that supports it, but pin latest to be safe.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="v$(node -p "require('./package.json').version")"
          test "$TAG" = "$VERSION" || { echo "tag ($TAG) does not match package.json version ($VERSION)"; exit 1; }

      # dist/ is gitignored and not in the repo — npm publish packs ./dist,
      # so it must be built before publishing (prepublishOnly also builds).
      - name: Build
        run: nr build

      # No NODE_AUTH_TOKEN and no registry-url here on purpose: with a token
      # present (even empty), npm skips OIDC and tries legacy auth instead.
      - name: Publish to npm
        run: npm publish --provenance --access public
